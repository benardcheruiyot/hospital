name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (tag or branch)'
        required: true
        default: 'main'
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version }}
      
      - name: Validate environment variables
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "ERROR: DEPLOY_HOST not set"
            exit 1
          fi
          if [ -z "${{ secrets.DEPLOY_USER }}" ]; then
            echo "ERROR: DEPLOY_USER not set"
            exit 1
          fi
          if [ -z "${{ secrets.DEPLOY_KEY }}" ]; then
            echo "ERROR: DEPLOY_KEY not set"
            exit 1
          fi
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      
      - name: Create deployment directory
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            mkdir -p ~/hospital-platform
      
      - name: Copy files to server
        run: |
          scp -i ~/.ssh/deploy_key -r \
            docker-compose.prod.yml \
            docker-compose.staging.yml \
            .env.example \
            nginx.conf \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/hospital-platform/
      
      - name: Deploy with Docker Compose
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
          cd ~/hospital-platform
          
          # Select the right compose file
          if [ "${{ github.event.inputs.environment }}" == "staging" ]; then
            COMPOSE_FILE="docker-compose.staging.yml"
          else
            COMPOSE_FILE="docker-compose.prod.yml"
          fi
          
          # Pull latest images
          docker compose -f $COMPOSE_FILE pull
          
          # Start services
          docker compose -f $COMPOSE_FILE up -d
          
          # Wait for services to be healthy
          sleep 10
          docker compose -f $COMPOSE_FILE ps
          
          # Show logs
          docker compose -f $COMPOSE_FILE logs --tail=20
          EOF
      
      - name: Verify deployment
        run: |
          PROTOCOL="https"
          if [ "${{ github.event.inputs.environment }}" == "staging" ]; then
            PROTOCOL="http"
          fi
          
          # Wait for the application to be ready
          for i in {1..30}; do
            if curl -f $PROTOCOL://${{ secrets.DEPLOY_HOST }}/api/health 2>/dev/null; then
              echo "✓ Application is healthy"
              exit 0
            fi
            echo "Waiting for application to be ready... ($i/30)"
            sleep 2
          done
          
          echo "✗ Deployment verification failed"
          exit 1
      
      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
      
      - name: Create deployment status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = context.job.status === 'success' ? 'success' : 'failure';
            const message = `Deployment to ${{ github.event.inputs.environment }} ${{ github.event.inputs.version }}: ${status}`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number || 1,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            }).catch(() => {
              console.log('Could not create comment');
            });
