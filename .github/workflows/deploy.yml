name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (tag or branch)'
        required: true
        default: 'main'
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production
  workflow_run:
    workflows: ["Build & Push Docker Images"]
    types: [completed]

concurrency:
  group: deploy-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'deploy' }}
    permissions:
      contents: read
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}

    steps:
      - name: Resolve deploy ref
        id: refs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "env=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "env=production" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.ref }}

      - name: Resolve image tag
        id: image
        run: |
          DEPLOY_SHA="$(git rev-parse HEAD)"
          echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=main-${DEPLOY_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Resolve deployment host
        id: host
        run: |
          echo "value=${{ secrets.DEPLOY_HOST }}" >> "$GITHUB_OUTPUT"
      
      - name: Validate environment variables
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "ERROR: DEPLOY_HOST not set"
            exit 1
          fi
          if [ -z "${{ secrets.DEPLOY_KEY }}" ]; then
            echo "ERROR: DEPLOY_KEY not set"
            exit 1
          fi
          if [ "${{ steps.refs.outputs.env }}" = "production" ]; then
            for name in DB_PASSWORD JWT_SECRET CLIENT_URL API_URL SOCKET_URL GOOGLE_CLIENT_ID; do
              if [ -z "${!name}" ]; then
                echo "ERROR: $name not set for production"
                exit 1
              fi
            done
          fi
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLIENT_URL: ${{ secrets.CLIENT_URL }}
          API_URL: ${{ secrets.API_URL }}
          SOCKET_URL: ${{ secrets.SOCKET_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      
      - name: Setup SSH
        env:
          DEPLOY_HOST: ${{ steps.host.outputs.value }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          umask 077
          DEPLOY_KEY="${DEPLOY_KEY//\\n/$'\n'}"
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub
          KEY_FINGERPRINT="$(ssh-keygen -lf ~/.ssh/deploy_key.pub | awk '{print $2}')"
          echo "Deploy key fingerprint: $KEY_FINGERPRINT"
          echo "Deploy public key: $(cat ~/.ssh/deploy_key.pub)"
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Verify SSH access
        env:
          DEPLOY_HOST: ${{ steps.host.outputs.value }}
          DEPLOY_USER: ${{ env.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o PubkeyAuthentication=yes \
            -o PreferredAuthentications=publickey -o ConnectTimeout=15 \
            -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" 'printf "SSH authentication succeeded for %s\\n" "$USER"'
      
      - name: Verify and fix deploy user home directory
        env:
          DEPLOY_HOST: ${{ steps.host.outputs.value }}
          DEPLOY_USER: ${{ env.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" <<'HOME_FIX_EOF'
          set -e
          DEPLOY_HOME=/home/deploy
          if [ ! -d "$DEPLOY_HOME" ]; then
            sudo -n install -d -o deploy -g deploy -m 755 "$DEPLOY_HOME" || {
              echo "ERROR: cannot create $DEPLOY_HOME; provision the deploy account as root"
              exit 1
            }
          fi
          if [ ! -w "$DEPLOY_HOME" ]; then
            sudo -n chown deploy:deploy "$DEPLOY_HOME" || {
              echo "ERROR: cannot change owner of $DEPLOY_HOME; grant deploy passwordless sudo or fix it as root"
              exit 1
            }
            sudo -n chmod 755 "$DEPLOY_HOME"
          fi
          test -w "$DEPLOY_HOME" || { echo "ERROR: $DEPLOY_HOME is still not writable by deploy"; exit 1; }
          mkdir -p "$DEPLOY_HOME/.ssh"
          chmod 700 "$DEPLOY_HOME/.ssh"
          echo "✓ Deploy home is ready: $DEPLOY_HOME"
          HOME_FIX_EOF
      
      - name: Create deployment directory
        if: steps.refs.outputs.env == 'production'
        run: |
            ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key "${{ env.DEPLOY_USER }}@${{ steps.host.outputs.value }}" <<'DEPLOY_EOF'
            set -e
            DEPLOY_HOME=/home/deploy
            APP_DIR="$DEPLOY_HOME/hospital-digital-platform"
            mkdir -p "$APP_DIR/ssl" "$APP_DIR/logs" "$APP_DIR/backups"
            echo "Deployment directory ready: $APP_DIR"
            
            # Verify SSL certificates exist (if production deployment)
            if [ -f "$APP_DIR/ssl/fullchain.pem" ] && [ -f "$APP_DIR/ssl/privkey.pem" ]; then
              echo "✓ SSL certificates found"
            else
              echo "⚠ SSL certificates not found - they will be needed for production"
            fi
            DEPLOY_EOF
      
      - name: Copy files to server
        run: |
          scp -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key -r \
            docker-compose.prod.yml \
            docker-compose.staging.yml \
            .env.example \
            nginx.conf \
            "${{ env.DEPLOY_USER }}@${{ steps.host.outputs.value }}:/home/deploy/hospital-digital-platform/"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key "${{ env.DEPLOY_USER }}@${{ steps.host.outputs.value }}" \
            "rm -rf /home/deploy/hospital-digital-platform/frontend/nginx.conf && mkdir -p /home/deploy/hospital-digital-platform/frontend"
          scp -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key \
            frontend/nginx.conf \
            "${{ env.DEPLOY_USER }}@${{ steps.host.outputs.value }}:/home/deploy/hospital-digital-platform/frontend/nginx.conf"

      - name: Configure production environment
        if: steps.refs.outputs.env == 'production'
        env:
          DEPLOY_HOST: ${{ steps.host.outputs.value }}
          DEPLOY_USER: ${{ env.DEPLOY_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLIENT_URL: ${{ secrets.CLIENT_URL }}
          API_URL: ${{ secrets.API_URL }}
          SOCKET_URL: ${{ secrets.SOCKET_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          umask 077
          cat > .env.deploy <<EOF
          DB_NAME=hospital_platform
          DB_USER=postgres
          DB_PASSWORD=$DB_PASSWORD
          CLIENT_URL=$CLIENT_URL
          API_URL=$API_URL
          SOCKET_URL=$SOCKET_URL
          JWT_SECRET=$JWT_SECRET
          JWT_EXPIRES_IN=7d
          GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
          EOF
          base64 -w 0 .env.deploy > .env.deploy.b64
          scp -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key .env.deploy.b64 \
            "$DEPLOY_USER@$DEPLOY_HOST:/home/deploy/hospital-digital-platform/.env.deploy.b64"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /home/deploy/hospital-digital-platform && base64 -d .env.deploy.b64 > .env && chmod 600 .env && rm -f .env.deploy.b64"
          rm -f .env.deploy .env.deploy.b64
      
      - name: Deploy with Docker Compose
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          test -n "$DB_PASSWORD" || { echo "ERROR: DB_PASSWORD is empty"; exit 1; }
          ENVIRONMENT="${{ steps.refs.outputs.env }}"
          IMAGE_TAG="${{ steps.image.outputs.tag }}"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key "${{ env.DEPLOY_USER }}@${{ steps.host.outputs.value }}" <<EOF
          cd /home/deploy/hospital-digital-platform

          if [ "\$ENVIRONMENT" = "staging" ]; then
            COMPOSE_FILE="docker-compose.staging.yml"
            COMPOSE_PROJECT="hospital-platform-staging"
            export BACKEND_IMAGE="ghcr.io/benardcheruiyot/hospital/backend:develop"
            export FRONTEND_IMAGE="ghcr.io/benardcheruiyot/hospital/frontend:develop"
          else
            COMPOSE_FILE="docker-compose.prod.yml"
            COMPOSE_PROJECT="hospital-platform"
            export BACKEND_IMAGE="ghcr.io/benardcheruiyot/hospital/backend:${IMAGE_TAG}"
            export FRONTEND_IMAGE="ghcr.io/benardcheruiyot/hospital/frontend:${IMAGE_TAG}"
          fi

          test -f .env || { echo "Missing /home/deploy/hospital-digital-platform/.env"; exit 1; }
          docker compose --project-name "\$COMPOSE_PROJECT" -f "\$COMPOSE_FILE" config -q
          docker compose --project-name "\$COMPOSE_PROJECT" -f "\$COMPOSE_FILE" pull
          docker compose --project-name "\$COMPOSE_PROJECT" -f "\$COMPOSE_FILE" up -d db
          for i in {1..30}; do
            DB_CONTAINER="$(docker compose --project-name "\$COMPOSE_PROJECT" -f "\$COMPOSE_FILE" ps -q db)"
            DB_STATUS="$(docker inspect --format '{{.State.Health.Status}}' "\$DB_CONTAINER" 2>/dev/null || true)"
            if [ "\$DB_STATUS" = "healthy" ]; then break; fi
            if [ "\$DB_STATUS" = "unhealthy" ]; then
              docker compose --project-name "\$COMPOSE_PROJECT" -f "\$COMPOSE_FILE" logs --tail=80 db
              exit 1
            fi
            sleep 2
          done
          printf '%s\n' "ALTER ROLE postgres PASSWORD :'db_password';" | \
            docker exec -i -e DB_PASSWORD="$DB_PASSWORD" "\$COMPOSE_PROJECT-db-1" \
            sh -c 'psql -U postgres -v db_password="\$DB_PASSWORD"'
          docker compose --project-name "\$COMPOSE_PROJECT" -f "\$COMPOSE_FILE" up -d --remove-orphans
          for i in {1..90}; do
            BACKEND_CONTAINER="$(docker compose --project-name "\$COMPOSE_PROJECT" -f "\$COMPOSE_FILE" ps -q backend)"
            STATUS="$(docker inspect --format '{{.State.Health.Status}}' "\$BACKEND_CONTAINER" 2>/dev/null || true)"
            if [ "\$STATUS" = "healthy" ]; then exit 0; fi
            if [ "\$STATUS" = "unhealthy" ]; then
              docker compose --project-name "\$COMPOSE_PROJECT" -f "\$COMPOSE_FILE" logs --tail=80 backend
              exit 1
            fi
            sleep 2
          done
          docker compose --project-name "\$COMPOSE_PROJECT" -f "\$COMPOSE_FILE" ps
          docker compose --project-name "\$COMPOSE_PROJECT" -f "\$COMPOSE_FILE" logs --tail=80 backend
          exit 1
          EOF

      - name: Verify deployment
        run: |
          PROTOCOL="https"
          HOST="terralinkhealth.co.ke"
          if [ "${{ steps.refs.outputs.env }}" = "staging" ]; then
            PROTOCOL="http"
            HOST="${{ secrets.DEPLOY_HOST }}"
          fi

          for i in {1..30}; do
            if curl --fail --silent --show-error --connect-timeout 5 "$PROTOCOL://$HOST/api/health"; then
              echo "✓ Application is healthy"
              exit 0
            fi
            echo "Waiting for application to be ready... ($i/30)"
            sleep 2
          done

          echo "✗ Deployment verification failed"
          exit 1
      
      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
      
      - name: Create deployment status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = context.job.status === 'success' ? 'success' : 'failure';
            const environment = '${{ steps.refs.outputs.env }}';
            const ref = '${{ steps.refs.outputs.ref }}';
            const message = `Deployment to ${environment} (${ref}): ${status}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number || 1,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            }).catch(() => {
              console.log('Could not create comment');
            });
