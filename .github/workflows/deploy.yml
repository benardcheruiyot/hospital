name: Deploy to Production

on:
  workflow_run:
    workflows: ["Build & Push Docker Images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (tag or branch)'
        required: true
        default: 'main'
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref_name || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}

    steps:
      - name: Resolve deploy ref
        id: refs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "env=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "env=production" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.ref }}

      - name: Resolve image tag
        id: image
        run: |
          DEPLOY_SHA="$(git rev-parse HEAD)"
          echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=main-${DEPLOY_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Resolve deployment host
        id: host
        run: |
          if [ "${{ steps.refs.outputs.env }}" = "production" ]; then
            echo "value=terralinkhealth.co.ke" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ secrets.DEPLOY_HOST }}" >> "$GITHUB_OUTPUT"
          fi
      
      - name: Validate environment variables
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "ERROR: DEPLOY_HOST not set"
            exit 1
          fi
          if [ -z "${{ secrets.DEPLOY_USER }}" ]; then
            echo "ERROR: DEPLOY_USER not set"
            exit 1
          fi
          if [ -z "${{ secrets.DEPLOY_KEY }}" ]; then
            echo "ERROR: DEPLOY_KEY not set"
            exit 1
          fi
          if [ "${{ steps.refs.outputs.env }}" = "production" ]; then
            for name in DB_PASSWORD JWT_SECRET CLIENT_URL API_URL SOCKET_URL; do
              if [ -z "${!name}" ]; then
                echo "ERROR: $name not set for production"
                exit 1
              fi
            done
          fi
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLIENT_URL: ${{ secrets.CLIENT_URL }}
          API_URL: ${{ secrets.API_URL }}
          SOCKET_URL: ${{ secrets.SOCKET_URL }}
      
      - name: Setup SSH
        env:
          DEPLOY_HOST: ${{ steps.host.outputs.value }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          umask 077
          DEPLOY_KEY="${DEPLOY_KEY//\\n/$'\n'}"
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub
          KEY_FINGERPRINT="$(ssh-keygen -lf ~/.ssh/deploy_key.pub | awk '{print $2}')"
          echo "Deploy key fingerprint: $KEY_FINGERPRINT"
          echo "Deploy public key: $(cat ~/.ssh/deploy_key.pub)"
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Verify SSH access
        env:
          DEPLOY_HOST: ${{ steps.host.outputs.value }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o PubkeyAuthentication=yes \
            -o PreferredAuthentications=publickey -o ConnectTimeout=15 \
            -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" 'printf "SSH authentication succeeded for %s\\n" "$USER"'
      
      - name: Create deployment directory
        if: steps.refs.outputs.env == 'production'
        run: |
            ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ steps.host.outputs.value }} \
            "mkdir -p ~/hospital-digital-platform/ssl ~/hospital-digital-platform/logs ~/hospital-digital-platform/backups && test -r ~/hospital-digital-platform/ssl/fullchain.pem && test -r ~/hospital-digital-platform/ssl/privkey.pem"
      
      - name: Copy files to server
        run: |
          scp -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key -r \
            docker-compose.prod.yml \
            docker-compose.staging.yml \
            .env.example \
            nginx.conf \
            ${{ secrets.DEPLOY_USER }}@${{ steps.host.outputs.value }}:~/hospital-digital-platform/

      - name: Configure production environment
        if: steps.refs.outputs.env == 'production'
        env:
          DEPLOY_HOST: ${{ steps.host.outputs.value }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLIENT_URL: ${{ secrets.CLIENT_URL }}
          API_URL: ${{ secrets.API_URL }}
          SOCKET_URL: ${{ secrets.SOCKET_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          umask 077
          cat > .env.deploy <<EOF
          DB_NAME=hospital_platform
          DB_USER=postgres
          DB_PASSWORD=$DB_PASSWORD
          CLIENT_URL=$CLIENT_URL
          API_URL=$API_URL
          SOCKET_URL=$SOCKET_URL
          JWT_SECRET=$JWT_SECRET
          JWT_EXPIRES_IN=7d
          GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
          EOF
          base64 -w 0 .env.deploy > .env.deploy.b64
          scp -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key .env.deploy.b64 \
            "$DEPLOY_USER@$DEPLOY_HOST:~/hospital-digital-platform/.env.deploy.b64"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd ~/hospital-digital-platform && base64 -d .env.deploy.b64 > .env && chmod 600 .env && rm -f .env.deploy.b64"
          rm -f .env.deploy .env.deploy.b64
      
      - name: Deploy with Docker Compose
        run: |
          ENVIRONMENT="${{ steps.refs.outputs.env }}"
          IMAGE_TAG="${{ steps.image.outputs.tag }}"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ steps.host.outputs.value }} <<EOF
          cd ~/hospital-digital-platform

          if [ "\$ENVIRONMENT" = "staging" ]; then
            COMPOSE_FILE="docker-compose.staging.yml"
            COMPOSE_PROJECT="hospital-platform-staging"
            export BACKEND_IMAGE="ghcr.io/benardcheruiyot/hospital/backend:develop"
            export FRONTEND_IMAGE="ghcr.io/benardcheruiyot/hospital/frontend:develop"
          else
            COMPOSE_FILE="docker-compose.prod.yml"
            COMPOSE_PROJECT="hospital-platform-production"
            export BACKEND_IMAGE="ghcr.io/benardcheruiyot/hospital/backend:${IMAGE_TAG}"
            export FRONTEND_IMAGE="ghcr.io/benardcheruiyot/hospital/frontend:${IMAGE_TAG}"
          fi

          test -f .env || { echo "Missing ~/hospital-digital-platform/.env"; exit 1; }
          docker compose --project-name "\$COMPOSE_PROJECT" -f "\$COMPOSE_FILE" config -q
          docker compose --project-name "\$COMPOSE_PROJECT" -f "\$COMPOSE_FILE" pull
          docker compose --project-name "\$COMPOSE_PROJECT" -f "\$COMPOSE_FILE" up -d --remove-orphans
          for i in {1..30}; do
            STATUS="$(docker inspect --format '{{.State.Health.Status}}' \"\$COMPOSE_PROJECT-backend-1\" 2>/dev/null || true)"
            if [ "\$STATUS" = "healthy" ]; then exit 0; fi
            if [ "\$STATUS" = "unhealthy" ]; then
              docker compose --project-name "\$COMPOSE_PROJECT" -f "\$COMPOSE_FILE" logs --tail=80 backend
              exit 1
            fi
            sleep 2
          done
          docker compose --project-name "\$COMPOSE_PROJECT" -f "\$COMPOSE_FILE" ps
          docker compose --project-name "\$COMPOSE_PROJECT" -f "\$COMPOSE_FILE" logs --tail=80 backend
          exit 1
          EOF

      - name: Verify deployment
        run: |
          PROTOCOL="https"
          HOST="terralinkhealth.co.ke"
          if [ "${{ steps.refs.outputs.env }}" = "staging" ]; then
            PROTOCOL="http"
            HOST="${{ secrets.DEPLOY_HOST }}"
          fi

          for i in {1..30}; do
            if curl --fail --silent --show-error --connect-timeout 5 "$PROTOCOL://$HOST/api/health"; then
              echo "✓ Application is healthy"
              exit 0
            fi
            echo "Waiting for application to be ready... ($i/30)"
            sleep 2
          done

          echo "✗ Deployment verification failed"
          exit 1
      
      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
      
      - name: Create deployment status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = context.job.status === 'success' ? 'success' : 'failure';
            const environment = '${{ steps.refs.outputs.env }}';
            const ref = '${{ steps.refs.outputs.ref }}';
            const message = `Deployment to ${environment} (${ref}): ${status}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number || 1,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            }).catch(() => {
              console.log('Could not create comment');
            });
