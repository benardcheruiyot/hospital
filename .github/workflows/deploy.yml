name: Deploy to Production

on:
  workflow_run:
    workflows: ["Build & Push Docker Images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (tag or branch)'
        required: true
        default: 'main'
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref_name || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}

    steps:
      - name: Resolve deploy ref
        id: refs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "env=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
            echo "env=production" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.ref }}
      
      - name: Validate environment variables
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "ERROR: DEPLOY_HOST not set"
            exit 1
          fi
          if [ -z "${{ secrets.DEPLOY_USER }}" ]; then
            echo "ERROR: DEPLOY_USER not set"
            exit 1
          fi
          if [ -z "${{ secrets.DEPLOY_KEY }}" ]; then
            echo "ERROR: DEPLOY_KEY not set"
            exit 1
          fi
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      
      - name: Create deployment directory
        if: steps.refs.outputs.env == 'production'
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "mkdir -p ~/hospital-digital-platform/ssl && if [ ! -f ~/hospital-digital-platform/ssl/fullchain.pem ] && [ -f ~/hospital-platform/ssl/fullchain.pem ]; then cp ~/hospital-platform/ssl/fullchain.pem ~/hospital-digital-platform/ssl/fullchain.pem; fi && if [ ! -f ~/hospital-digital-platform/ssl/privkey.pem ] && [ -f ~/hospital-platform/ssl/privkey.pem ]; then cp ~/hospital-platform/ssl/privkey.pem ~/hospital-digital-platform/ssl/privkey.pem; fi && test -f ~/hospital-digital-platform/ssl/fullchain.pem && test -f ~/hospital-digital-platform/ssl/privkey.pem"
      
      - name: Copy files to server
        run: |
          scp -i ~/.ssh/deploy_key -r \
            docker-compose.prod.yml \
            docker-compose.staging.yml \
            .env.example \
            nginx.conf \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/hospital-digital-platform/
      
      - name: Deploy with Docker Compose
        run: |
          ENVIRONMENT="${{ steps.refs.outputs.env }}"
          IMAGE_TAG="$(echo "${{ steps.refs.outputs.ref }}" | tr '/' '-')"
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} <<EOF
          cd ~/hospital-digital-platform

          if [ "\$ENVIRONMENT" = "staging" ]; then
            COMPOSE_FILE="docker-compose.staging.yml"
            COMPOSE_PROJECT="hospital-platform-staging"
            export BACKEND_IMAGE="ghcr.io/benardcheruiyot/hospital/backend:develop"
            export FRONTEND_IMAGE="ghcr.io/benardcheruiyot/hospital/frontend:develop"
          else
            COMPOSE_FILE="docker-compose.prod.yml"
            COMPOSE_PROJECT="hospital-platform-production"
            export BACKEND_IMAGE="ghcr.io/benardcheruiyot/hospital/backend:\$IMAGE_TAG"
            export FRONTEND_IMAGE="ghcr.io/benardcheruiyot/hospital/frontend:\$IMAGE_TAG"
          fi

          docker compose --project-name "\$COMPOSE_PROJECT" -f "\$COMPOSE_FILE" pull
          docker compose --project-name "\$COMPOSE_PROJECT" -f "\$COMPOSE_FILE" up -d
          sleep 10
          docker compose --project-name "\$COMPOSE_PROJECT" -f "\$COMPOSE_FILE" ps
          docker compose --project-name "\$COMPOSE_PROJECT" -f "\$COMPOSE_FILE" logs --tail=20
          EOF

      - name: Verify deployment
        run: |
          PROTOCOL="https"
          HOST="terralinkhealth.co.ke"
          if [ "${{ steps.refs.outputs.env }}" = "staging" ]; then
            PROTOCOL="http"
            HOST="${{ secrets.DEPLOY_HOST }}"
          fi

          for i in {1..30}; do
            if curl --fail --silent --show-error "$PROTOCOL://$HOST/api/health" 2>/dev/null; then
              echo "✓ Application is healthy"
              exit 0
            fi
            echo "Waiting for application to be ready... ($i/30)"
            sleep 2
          done

          echo "✗ Deployment verification failed"
          exit 1
      
      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
      
      - name: Create deployment status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = context.job.status === 'success' ? 'success' : 'failure';
            const environment = '${{ steps.refs.outputs.env }}';
            const ref = '${{ steps.refs.outputs.ref }}';
            const message = `Deployment to ${environment} (${ref}): ${status}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number || 1,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            }).catch(() => {
              console.log('Could not create comment');
            });
