name: hospital-platform-staging

version: '3.9'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-hospital_platform}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - '${STAGING_DB_PORT:-5433}:5432'
    volumes:
      - db_data_staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/benardcheruiyot/hospital/backend:develop
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: staging
      PORT: 5000
      CLIENT_URL: http://${STAGING_DOMAIN:-localhost}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hospital_platform}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_long_random_secret}
      JWT_EXPIRES_IN: 7d
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 200
    ports:
      - '${STAGING_API_PORT:-5001}:5000'
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - hospital-network

  frontend:
    image: ghcr.io/benardcheruiyot/hospital/frontend:develop
    restart: always
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://backend:5000/api
      VITE_SOCKET_URL: http://${STAGING_DOMAIN:-localhost}
    ports:
      - '${STAGING_HTTP_PORT:-8080}:80'
    networks:
      - hospital-network

volumes:
  db_data_staging:
    name: hospital-platform_db_data_staging

networks:
  hospital-network:
    driver: bridge
