server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache static assets with versioned filenames
    location ~* ^/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        # Files in assets have content hashes in their names, so they can be cached permanently
        expires max;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA: Try to serve the file, if not found, serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache control for index.html (SPA entry point)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
